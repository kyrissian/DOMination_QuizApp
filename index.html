<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Quiz!</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Delius&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Raleway:ital,wght@0,100..900;1,100..900&family=Tomorrow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="quiz-container">
        <h1>JavaScript FUNdamentals Quiz</h1>
        <h2>Test your knowledge of JavaScript basics with this FUN quiz!</h2>

        <h3 id="question"></h3>

        <div id="choices-container"></div>

        <button id="next" disabled>Next Question</button>
    </div>

    <div id="score-container" class="hidden">
        <h2>Your Score:</h2>
        <p id="score-text"></p>
        <button id="restart">Restart Quiz</button>
    </div>
</body>

</html>
